name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.3.0). Leave blank to use the tag.'
        required: false

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    name: Publish to npm via Trusted Publishing
    runs-on: ubuntu-latest
    environment: DrAgentic-2026-09-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing milestr@${VERSION}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag (${VERSION})"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Skill version matches package.json
        run: npm run check-skill-version

      - name: Migration contract
        run: npm run check-migrations

      - name: Test
        run: npm test

      - name: Publish (OIDC Trusted Publishing)
        # NODE_AUTH_TOKEN intentionally not set — setup-node@v4 mints an OIDC
        # token and exports it as NODE_AUTH_TOKEN for this step. Setting it to
        # anything (including '') disables the OIDC helper.
        run: |
          set +e
          echo "=== TOKEN CLAIMS ==="
          TOKEN_LEN=${#NODE_AUTH_TOKEN}
          echo "Token length: $TOKEN_LEN"
          if [ "$TOKEN_LEN" -gt 0 ]; then
            node -e "
              const t = process.env.NODE_AUTH_TOKEN;
              const parts = t.split('.');
              const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString());
              console.log(JSON.stringify(claims, null, 2));
            "
          else
            echo "NO TOKEN"
          fi
          echo "=== END ==="
          set -e
          npm publish --provenance --access public